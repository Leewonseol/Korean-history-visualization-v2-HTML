name: Opening worlds and historical integrity
on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Possible-world constraints
        run: node tools/opening-worlds-test.mjs
      - name: Research source URL policy
        run: node tools/source-policy-check.mjs
      - name: Original source and network tests
        run: |
          node tools/validate.mjs
          node tools/test.mjs
          node tools/golden.mjs
          node tools/integrity.mjs
          node tools/build-check.mjs
